# 9-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ordoservitii
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ordoservitii-api:latest
          #imagePullPolicy: IfNotPresent  
          imagePullPolicy: Never 
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: ordoservitii-secrets
            - configMapRef:
                name: ordoservitii-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ordoservitii
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001