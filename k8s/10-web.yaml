# 10-web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ordoservitii
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # SUBSTITUA pelo caminho real do seu registry
          image: ordoservitii-web:latest
          imagePullPolicy: Never 
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ordoservitii
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80